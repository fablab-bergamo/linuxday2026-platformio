; Variante AI per la CYD ESP32-2432S028R.
[env:esp32dev]
platform = espressif32 @ 6.5.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
lib_deps =
    adafruit/Adafruit ILI9341 @ 1.6.1
    adafruit/Adafruit GFX Library @ 1.11.11
    adafruit/Adafruit BusIO @ 1.16.2
    ; Versione 1.4 ufficiale: il registro PlatformIO pubblica solo una revisione precedente.
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#d57f64c8b5f2bc5b8d10d121550806eeff7b06d9
