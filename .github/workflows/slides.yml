name: Presentazione e GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: slides-${{ github.ref }}
  cancel-in-progress: true
jobs:
  slides:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Verifica indice e navigazione nel sottopercorso Pages
        run: node scripts/check-navigation.mjs
      - run: npm run export
      - uses: actions/upload-artifact@v6
        with:
          name: linux-day-2026-slides
          path: |
            dist/
            slides-export.pdf
          if-no-files-found: error
      - name: Prepara artefatto Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: slides
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica presentazione
        id: deployment
        uses: actions/deploy-pages@v4
